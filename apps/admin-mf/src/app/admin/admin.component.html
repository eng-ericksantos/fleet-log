<div>
  <div class="border-b border-gray-200 mb-6">
    <nav class="flex space-x-8">
      <a routerLink="vehicles" routerLinkActive="border-blue-500 text-blue-600"
        class="py-3 px-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors">
        🚛 Veículos
      </a>
      <a routerLink="drivers" routerLinkActive="border-blue-500 text-blue-600"
        class="py-3 px-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors">
        👤 Motoristas
      </a>
    </nav>
  </div>

  <router-outlet></router-outlet>
</div>

<div class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none">
  <div *ngFor="let toast of toastService.toasts$ | async"
    class="flex items-center gap-3 px-4 py-3.5 rounded-xl shadow-lg text-sm font-medium pointer-events-auto min-w-[280px] max-w-sm"
    [class.bg-emerald-600]="toast.type === 'success'"
    [class.text-white]="toast.type === 'success'"
    [class.bg-red-600]="toast.type === 'error'"
    [class.text-white]="toast.type === 'error'"
    [class.bg-blue-600]="toast.type === 'info'"
    [class.text-white]="toast.type === 'info'">

    <svg *ngIf="toast.type === 'success'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
    <svg *ngIf="toast.type === 'error'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
    </svg>
    <svg *ngIf="toast.type === 'info'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/>
    </svg>

    <span class="flex-1">{{ toast.message }}</span>

    <button (click)="toastService.remove(toast.id)" class="opacity-70 hover:opacity-100 transition-opacity">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
