<div
  *ngIf="mobileMenuOpen"
  class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden"
  (click)="closeMobileMenu()"
></div>

<div class="flex min-h-screen bg-slate-100">

  <aside
    class="hidden lg:flex flex-col fixed inset-y-0 left-0 z-30 transition-all duration-300 border-r border-white/10"
    [class.w-64]="sidebarOpen"
    [class.w-[72px]]="!sidebarOpen"
    style="background: rgb(10, 25, 41);"
  >
    <div class="flex items-center h-16 px-4 border-b border-white/10">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-accent-500 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25m-3.75 0V5.625m0 12.75v-2.25m0-6.375h3.75m-3.75 0V5.625m0 0A2.625 2.625 0 0 1 13.125 3h.375" />
          </svg>
        </div>
        <span
          *ngIf="sidebarOpen"
          class="text-lg font-bold text-white tracking-tight whitespace-nowrap"
        >fleet-log</span>
      </div>
    </div>

    <nav class="flex-1 py-4 space-y-1 px-3 overflow-y-auto">
      <a
        routerLink="/home"
        routerLinkActive="sidebar-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar-link group"
        [class.justify-center]="!sidebarOpen"
        [class.px-3]="sidebarOpen"
        [class.px-0]="!sidebarOpen"
      >
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span *ngIf="sidebarOpen" class="sidebar-label">Início</span>
      </a>

      <a
        routerLink="/admin"
        routerLinkActive="sidebar-active"
        class="sidebar-link group"
        [class.justify-center]="!sidebarOpen"
        [class.px-3]="sidebarOpen"
        [class.px-0]="!sidebarOpen"
      >
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <span *ngIf="sidebarOpen" class="sidebar-label">Administração</span>
      </a>

      <a
        routerLink="/dash"
        routerLinkActive="sidebar-active"
        class="sidebar-link group"
        [class.justify-center]="!sidebarOpen"
        [class.px-3]="sidebarOpen"
        [class.px-0]="!sidebarOpen"
      >
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605" />
        </svg>
        <span *ngIf="sidebarOpen" class="sidebar-label">Dashboard</span>
      </a>

      <a
        routerLink="/dash/observability"
        routerLinkActive="sidebar-active"
        class="sidebar-link group"
        [class.justify-center]="!sidebarOpen"
        [class.px-3]="sidebarOpen"
        [class.px-0]="!sidebarOpen"
      >
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        <span *ngIf="sidebarOpen" class="sidebar-label">Observabilidade</span>
      </a>
    </nav>

    <div class="px-4 py-3 border-t border-white/10">
      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors"
      >
        <svg
          class="w-5 h-5 transition-transform duration-300"
          [class.rotate-180]="!sidebarOpen"
          fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5" />
        </svg>
        <span *ngIf="sidebarOpen" class="text-xs font-medium">Recolher</span>
      </button>
    </div>
  </aside>

  <aside
    class="lg:hidden fixed inset-y-0 left-0 z-50 w-72 flex flex-col border-r border-white/10 transition-transform duration-300"
    [class.-translate-x-full]="!mobileMenuOpen"
    [class.translate-x-0]="mobileMenuOpen"
    style="background: rgb(10, 25, 41);"
  >
    <div class="flex items-center justify-between h-16 px-4 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-accent-500 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25m-3.75 0V5.625m0 12.75v-2.25m0-6.375h3.75m-3.75 0V5.625m0 0A2.625 2.625 0 0 1 13.125 3h.375" />
          </svg>
        </div>
        <span class="text-lg font-bold text-white tracking-tight">fleet-log</span>
      </div>
      <button (click)="closeMobileMenu()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 py-4 space-y-1 px-3 overflow-y-auto">
      <a routerLink="/home" routerLinkActive="sidebar-active" [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar-link px-3" (click)="closeMobileMenu()">
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span class="sidebar-label">Início</span>
      </a>

      <a routerLink="/admin" routerLinkActive="sidebar-active"
        class="sidebar-link px-3" (click)="closeMobileMenu()">
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <span class="sidebar-label">Administração</span>
      </a>

      <a routerLink="/dash" routerLinkActive="sidebar-active"
        class="sidebar-link px-3" (click)="closeMobileMenu()">
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605" />
        </svg>
        <span class="sidebar-label">Dashboard</span>
      </a>

      <a routerLink="/dash/observability" routerLinkActive="sidebar-active"
        class="sidebar-link px-3" (click)="closeMobileMenu()">
        <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        <span class="sidebar-label">Observabilidade</span>
      </a>
    </nav>

    <div class="px-4 py-3 border-t border-white/10">
      <p class="text-xs text-slate-500">Fleet-Log v1.0 • TCC</p>
    </div>
  </aside>

  <div
    class="flex-1 flex flex-col min-w-0 transition-all duration-300"
    [class.lg:ml-64]="sidebarOpen"
    [class.lg:ml-[72px]]="!sidebarOpen"
  >
    <header
      class="sticky top-0 z-20 h-16 flex items-center justify-between px-4 sm:px-6 border-b border-slate-200"
      style="background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.06);"
    >
      <div class="flex items-center gap-3">
        <button
          (click)="openMobileMenu()"
          class="lg:hidden p-2 -ml-2 rounded-lg text-slate-500 hover:text-navy-900 hover:bg-slate-100 transition-colors"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
        <h1 class="text-base sm:text-lg font-semibold text-navy-900 tracking-tight">
          Sistema de Gestão de Frotas
        </h1>
      </div>

      <div class="flex items-center gap-3">
        <button class="relative p-2 rounded-lg text-slate-400 hover:text-navy-800 hover:bg-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-accent-500 rounded-full"></span>
        </button>

        <div class="hidden sm:block w-px h-6 bg-slate-200"></div>

        <button class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-navy-700 to-navy-900 flex items-center justify-center">
            <span class="text-xs font-bold text-white">FL</span>
          </div>
          <span class="hidden sm:block text-sm font-medium text-navy-800">Operador</span>
          <svg class="hidden sm:block w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 bg-slate-50 p-4 sm:p-6">
      <router-outlet></router-outlet>
    </main>

    <footer class="flex-shrink-0 h-9 flex items-center justify-between px-4 sm:px-6 border-t border-slate-200/80 bg-white/70 backdrop-blur-sm">
      <span class="text-xs text-slate-400 hidden sm:block">Fleet-Log v1.0 · TCC</span>

      <div class="flex items-center gap-5 ml-auto">

        <ng-container *ngIf="coreStatus$ | async as core">
          <div class="flex items-center gap-1.5" title="Core API — NestJS + PostgreSQL (localhost:3000)">
            <span
              class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0 shadow-sm"
              [ngClass]="ledClass(core)"
            ></span>
            <span class="text-xs text-slate-500">NestJS</span>
            <span class="text-xs font-semibold" [ngClass]="ledTextClass(core)">
              {{ ledLabel(core) }}
            </span>
          </div>
        </ng-container>

        <div class="w-px h-4 bg-slate-200"></div>

        <ng-container *ngIf="telemetryStatus$ | async as telemetry">
          <div class="flex items-center gap-1.5" title="Telemetry API — FastAPI + MongoDB (localhost:8000)">
            <span
              class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0 shadow-sm"
              [ngClass]="ledClass(telemetry)"
            ></span>
            <span class="text-xs text-slate-500">FastAPI</span>
            <span class="text-xs font-semibold" [ngClass]="ledTextClass(telemetry)">
              {{ ledLabel(telemetry) }}
            </span>
          </div>
        </ng-container>

      </div>
    </footer>
  </div>
</div>

<app-latency-toast></app-latency-toast>
